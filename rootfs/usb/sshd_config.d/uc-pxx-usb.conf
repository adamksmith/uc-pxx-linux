# The USB network of /etc/conf.d/uc-pxx-usb (UC_PXX_USB_NET=on; OFF by
# default; uc-pxx-installer mainline-rc-4, owner decision 2026-11-11): ssh
# takes a key only (no password, no keyboard login) on the unit's address of
# that network AND from any client address of it, also when the computer on
# the cable connects to the unit's LAN address (the unit routes its answers
# to 10.99.0.0/24 only over the cable; uc-pxx-xfer turns IPv6 off there).
Match LocalAddress 10.99.0.2
	PasswordAuthentication no
	KbdInteractiveAuthentication no
	PermitEmptyPasswords no
	AuthenticationMethods publickey
Match Address 10.99.0.0/24
	PasswordAuthentication no
	KbdInteractiveAuthentication no
	PermitEmptyPasswords no
	AuthenticationMethods publickey
