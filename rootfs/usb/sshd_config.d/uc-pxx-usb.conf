# The USB network of /etc/conf.d/uc-pxx-usb (UC_PXX_USB_NET=on; OFF by
# default; uc-pxx-installer mainline-rc-4, owner decision 2026-11-11): on the
# unit's address of that network ssh takes a key only (no password, no
# keyboard login), whatever the rest of sshd_config allows on the LAN.
Match LocalAddress 10.99.0.2
	PasswordAuthentication no
	KbdInteractiveAuthentication no
	PermitEmptyPasswords no
	AuthenticationMethods publickey
