# /etc/tsx/audio.conf: sound card setup (uc-pxx-audio init at boot)
# After editing: rc-service uc-pxx-audio restart
#
# The volume is the softvol control "Master" (/etc/asound.conf), in %.
# The codec control "PCM Playback Volume" of the AIC3104 (0 to 127, one step =
# 0.5 dB, 127 = 0 dB) stays at VOLUME_MAX, the ceiling of the speaker. The
# stock firmware plays at 115, which is much too loud on the speaker.
# The card name is TSX_SOUND_CARD in the board file. uc-pxx-audio card prints it.
# The volume in % at the first boot (no saved volume): 58 % = -12.6 dB on
# Master, -26 dB in all = the codec control 75 of the builds before RC-10c.
SPEAKER_VOLUME=58
# Codec control value (the ceiling, = Master 100 %). TODO: measure on the
# speaker. The value must stay below the stock level 115.
VOLUME_MAX=100
# Not used since RC-10c (the codec control at 1 % before; Master now spans the
# same 30 dB, /etc/asound.conf).
VOLUME_MIN=40
# Volume in % (Master) while the Sendspin player runs (uc-pxx-audio fixed).
# The player volume of Music Assistant is then the volume of the panel.
VOLUME_SENDSPIN=100
# Capture level of the PGA (control "PGA Capture Volume"), 0 to 119.
MIC_VOLUME=30
