# /etc/asound.conf: UC-P10 audio (kernel sound card UCP10; measured 2026-10-24).
# Playback: I2S0 runs 4 channels. Channels 1 and 2 are SDO0 (TAS5825M, not
# fitted on the units that we have). Channels 3 and 4 are SDO1 (AIC3104).
# Channel 3 (left DAC) is not wired to anything audible. Channel 4 (right
# DAC) drives the hands-free speaker and the handset earpiece. The enables
# hf-ext-amp and hs-ext-amp select them. Both are on by default.
# Capture: 8 channels. Channels 1 and 2 are the speakerphone microphones.
# Channel 3 is the handset microphone (AIC3104 LINE1L, powered with
# hs-ext-amp). Channel 4 is the right ADC of the AIC3104 (not used). Channels
# 5 to 8 are silent.
# The first 0.5 s of a capture holds the power-up transient of the ADC and the
# PGA. Discard it.
#
# The layout of the tsx panels (as on the xx60), so that the kiosk browser,
# the voice satellite and the Sendspin player share the card:
#   default / speaker  -> "Master" softvol -> mono on all 4 channels -> dmix
#                         (Chromium, TTS, sounds)
#   media              -> "Media" softvol -> Master     (Sendspin: TTS can duck it)
#   mic                -> dsnoop, the two speakerphone microphones mixed to
#                         mono, any rate/channels (plug converts; the voice
#                         satellite uses 16 kHz mono)
#   speakerphone_mics, handset_mic, all_mics  -> dsnoop (named capture PCMs)
#   default capture    -> speakerphone_mics (as before)
# dmix and dsnoop keep the hardware at 48 kHz, S32_LE, 4 (playback) and 8
# (capture) channels, period 480, buffer 3840, for every client.
#
# Volume: "Master" is the volume of the panel (uc-pxx-audio volume, the Home
# Assistant number "Volume", the setup page, the panel app). Linear in dB:
# 100 % = 0 dB, 50 % = -15 dB, 1 % = -29.7 dB, 0 % = silence (softvol has no
# mute switch). The codec level ("PCM Playback Volume") is the fixed ceiling
# VOLUME_MAX of /etc/tsx/audio.conf (100 = -13.5 dB). Master spans 30 dB (the
# xx60 spans 50 dB) so that a volume in % sounds as it did before RC-10c,
# when it set the codec (1 % = control 40, 100 % = control 100, 0.5 dB steps).
# "Media" stays at 100 % (the voice satellite ducks it; -50 dB as on the
# xx60). uc-pxx-audio init creates both controls at boot and restores the
# saved volume.

pcm.tsx_dmix {
	type dmix
	ipc_key 51010
	ipc_key_add_uid false
	ipc_perm 0666
	slave {
		pcm "hw:UCP10,0"
		rate 48000
		format S32_LE
		channels 4
		period_size 480
		buffer_size 3840
	}
	bindings { 0 0 1 1 2 2 3 3 }
}

# Stereo mixed down to mono (0.5 L + 0.5 R) on all four channels. Channel 4
# is the one that is heard.
pcm.tsx_mono4 {
	type route
	slave { pcm "tsx_dmix"; channels 4 }
	ttable.0.0 0.5
	ttable.1.0 0.5
	ttable.0.1 0.5
	ttable.1.1 0.5
	ttable.0.2 0.5
	ttable.1.2 0.5
	ttable.0.3 0.5
	ttable.1.3 0.5
}

pcm.tsx_master {
	type softvol
	slave.pcm "tsx_mono4"
	control { name "Master"; card UCP10 }
	min_dB -30.0
	max_dB 0.0
	resolution 101
}

pcm.tsx_media {
	type softvol
	slave.pcm "tsx_master"
	control { name "Media"; card UCP10 }
	min_dB -50.0
	max_dB 0.0
	resolution 101
}

# Capture is shared (dsnoop). So the default capture, mic and handset_mic can
# run at the same time.
pcm.ucp10snoop {
	type dsnoop
	ipc_key 1010110
	ipc_perm 0666
	slave {
		pcm "hw:UCP10,0"
		channels 8
		rate 48000
		format S32_LE
		period_size 480
		buffer_size 3840
	}
}

# The two speakerphone microphones mixed to one channel.
pcm.tsx_mic_mono {
	type route
	slave { pcm "ucp10snoop"; channels 8 }
	ttable.0.0 0.5
	ttable.0.1 0.5
}

pcm.speaker {
	type plug
	slave.pcm "tsx_master"
	hint { show on; description "UC-P10 speaker (Master volume, shared)" }
}
pcm.media {
	type plug
	slave.pcm "tsx_media"
	hint { show on; description "UC-P10 speaker for music (Media + Master volume)" }
}
pcm.mic {
	type plug
	slave.pcm "tsx_mic_mono"
	hint { show on; description "UC-P10 speakerphone microphones (mono, shared)" }
}

# The old name of the default playback (the direct hw device before RC-10c):
# now the shared speaker.
pcm.ucp10play {
	type plug
	slave.pcm "tsx_master"
}

# Default capture: the two speakerphone microphones as stereo
pcm.speakerphone_mics {
	type plug
	slave { pcm "ucp10snoop"; channels 8; }
	ttable.0.0 1
	ttable.1.1 1
	hint { show on; description "UC-P10 speakerphone microphones (stereo, shared)" }
}

# Handset microphone, mono
pcm.handset_mic {
	type plug
	slave { pcm "ucp10snoop"; channels 8; }
	ttable.0.2 1
	hint { show on; description "UC-P10 handset microphone (mono, shared)" }
}

# All live microphones: channel 1 = speakerphone left, channel 2 =
# speakerphone right, channel 3 = handset
pcm.all_mics {
	type plug
	slave { pcm "ucp10snoop"; channels 8; }
	ttable.0.0 1
	ttable.1.1 1
	ttable.2.2 1
	hint { show on; description "UC-P10 microphones (speakerphone L, R, handset; shared)" }
}

pcm.!default {
	type asym
	playback.pcm "speaker"
	capture.pcm "speakerphone_mics"
}
ctl.!default { type hw; card UCP10; }

# Opening these PCMs creates the "Master" and "Media" controls on the card
# without touching the hardware (uc-pxx-audio init opens them at boot, before
# it restores the volume). The parameters must stay identical to tsx_master
# and tsx_media above.
pcm.tsx_master_ctl {
	type softvol
	slave.pcm "null"
	control { name "Master"; card UCP10 }
	min_dB -30.0
	max_dB 0.0
	resolution 101
}
pcm.tsx_media_ctl {
	type softvol
	slave.pcm "null"
	control { name "Media"; card UCP10 }
	min_dB -50.0
	max_dB 0.0
	resolution 101
}
