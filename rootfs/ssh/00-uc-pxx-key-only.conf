# The end-user build of a mainline payload (tools/mainline-payload/build.sh
# SSH_ACCESS=setup): sshd takes SSH keys only. This file sorts before tsx.conf
# of tsx-base, and sshd keeps the first value of each keyword, so these win.
# A root password of the setup page is for the console only.
PasswordAuthentication no
KbdInteractiveAuthentication no
